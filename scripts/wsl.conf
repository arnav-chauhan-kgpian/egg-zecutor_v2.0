# /etc/wsl.conf for the distro that runs the Judge0 stack.
#
# systemd=false is required, not a preference: systemd mounts the cgroup v2
# unified hierarchy and claims the controllers before anything else can, and
# under WSL it ignores systemd.unified_cgroup_hierarchy=0 because WSL's own
# init has already mounted /sys/fs/cgroup by the time PID 1 starts. With
# systemd out of the way the controllers are unclaimed at boot and
# wsl-cgroup-v1.sh can remount them as v1 — which is what `isolate` needs.
#
# Install with:
#   sudo install -m 0755 scripts/wsl-cgroup-v1.sh /usr/local/sbin/
#   sudo install -m 0755 scripts/wsl-boot.sh      /usr/local/sbin/
#   sudo cp scripts/wsl.conf /etc/wsl.conf
#   wsl --shutdown
[boot]
systemd=false
command=/usr/local/sbin/wsl-boot.sh

[user]
default=arnav
